<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>超级球球官网｜翻译进度预览</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6fa;color:#182034}
    header{height:72px;display:flex;align-items:center;gap:18px;padding:0 24px;background:#fff;border-bottom:1px solid #e6e9f0}
    h1{font-size:18px;margin:0}.badge{padding:6px 10px;border-radius:999px;background:#fff3d5;color:#8b5c00;font-size:12px}
    .controls{display:flex;gap:12px;margin-left:auto}select,button{height:38px;border:1px solid #d9deea;border-radius:9px;background:#fff;padding:0 12px;font-size:14px}button{background:#4b65f2;color:#fff;border:0;cursor:pointer}
    main{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 72px)}aside{padding:20px;background:#fff;border-right:1px solid #e6e9f0}
    h2{font-size:14px;margin:0 0 16px}.item{margin-bottom:16px}.row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.bar{height:7px;border-radius:9px;background:#e9edf5;overflow:hidden}.bar i{display:block;height:100%;background:#4b65f2}
    .note{margin-top:26px;padding:12px;border-radius:10px;background:#f4f6ff;color:#53607d;font-size:12px;line-height:1.6}
    iframe{width:100%;height:100%;border:0;background:#fff}@media(max-width:760px){header{height:auto;padding:12px;flex-wrap:wrap}.controls{width:100%;margin:0}.controls select,.controls button{flex:1}main{display:block;height:calc(100vh - 128px)}aside{display:none}}
  </style>
</head>
<body>
<header><h1>超级球球官网｜翻译进度预览</h1><span class="badge">内部预览 · 不会上线</span><div class="controls"><select id="page"><option value="index.html">首页</option><option value="product.html">产品页</option><option value="ai-system.html">YouAI 系统</option><option value="partner.html">商业合作</option><option value="contact.html">联系我们</option><option value="news.html">品牌资讯</option><option value="newsinfo/2026081201.html">正文：8月12日创投峰会</option><option value="newsinfo/2026081101.html">正文：8月11日合肥活动</option><option value="newsinfo/2026080701.html">正文：8月7日东莞漫博会</option><option value="newsinfo/2026072801.html">正文：7月28日三国活动</option><option value="newsinfo/2026072301.html">正文：7月23日壹基金活动</option><option value="newsinfo/2026072001.html">正文：7月20日 WAIC 2026</option></select><select id="lang"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="da">Dansk</option></select><button id="open">刷新预览</button></div></header>
<main><aside><h2>当前词条覆盖率</h2><div class="item"><div class="row"><span>首页</span><b>100%</b></div><div class="bar"><i style="width:100%"></i></div></div><div class="item"><div class="row"><span>产品页</span><b>100%</b></div><div class="bar"><i style="width:100%"></i></div></div><div class="item"><div class="row"><span>YouAI 系统</span><b>100%</b></div><div class="bar"><i style="width:100%"></i></div></div><div class="item"><div class="row"><span>商业合作</span><b>100%</b></div><div class="bar"><i style="width:100%"></i></div></div><div class="item"><div class="row"><span>联系我们</span><b>100%</b></div><div class="bar"><i style="width:100%"></i></div></div><div class="item"><div class="row"><span>资讯列表</span><b>100%</b></div><div class="bar"><i style="width:100%"></i></div></div><div class="item"><div class="row"><span>56 篇资讯正文</span><b>56/56 · 100%</b></div><div class="bar"><i style="width:100%"></i></div></div><div class="note">英文、日语与丹麦语词条已全部覆盖，并完成正文节点与图片顺序校验。官方中文产品搜索词、公众号名称和备案号按规则保留；海外页面人名统一采用大写拼音格式。上线前仍建议安排母语终审。</div></aside><iframe id="frame" title="官网翻译预览"></iframe></main>
<script>
  const page=document.querySelector('#page'),lang=document.querySelector('#lang'),frame=document.querySelector('#frame');
  const articleIds=["2026072801","2026072301","2026072001","2026071626","2026071505","2026070225","2026070122","2026062431","2026061746","2026060234","2026052924","2026052801","2026052704","2026051302","2026043028","2026041547","2026041048","2026040549","2026040423","2026040221","2026030830","2026030735","2026022707","2026012713","2026012612","2026011214","2026010719","2026010209","2025121910","2025121832","2025120950","2025120427","2025113039","2025112811","2025112508","2025111906","2025111103","2025111041","2025110733","2025110440","2025103018","2025101937","2025101520","2025101317","2025092645","2025082529","2025082436","2025081815","2025081643","2025081516","2025081444","2025081242","2025081038"];
  const existing=new Set([...page.options].map(option=>option.value));
  articleIds.forEach(id=>{const value=`newsinfo/${id}.html`;if(!existing.has(value)){const option=document.createElement('option');option.value=value;option.textContent=`资讯正文：${id}`;page.appendChild(option)}});
  function load(){localStorage.setItem('superbobo-language',lang.value);frame.src=page.value+'?preview='+Date.now()}
  document.querySelector('#open').addEventListener('click',load);page.addEventListener('change',load);lang.addEventListener('change',load);load();
</script>
</body>
</html>
