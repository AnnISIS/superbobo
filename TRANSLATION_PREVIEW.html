<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>超级球球官网｜翻译进度预览</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6fa;color:#182034}
    header{height:72px;display:flex;align-items:center;gap:18px;padding:0 24px;background:#fff;border-bottom:1px solid #e6e9f0}
    h1{font-size:18px;margin:0}.badge{padding:6px 10px;border-radius:999px;background:#fff3d5;color:#8b5c00;font-size:12px}
    .controls{display:flex;gap:12px;margin-left:auto}select,button{height:38px;border:1px solid #d9deea;border-radius:9px;background:#fff;padding:0 12px;font-size:14px}button{background:#4b65f2;color:#fff;border:0;cursor:pointer}
    main{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 72px)}aside{padding:20px;background:#fff;border-right:1px solid #e6e9f0}
    h2{font-size:14px;margin:0 0 16px}.item{margin-bottom:16px}.row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.bar{height:7px;border-radius:9px;background:#e9edf5;overflow:hidden}.bar i{display:block;height:100%;background:#4b65f2}
    .note{margin-top:26px;padding:12px;border-radius:10px;background:#f4f6ff;color:#53607d;font-size:12px;line-height:1.6}
    iframe{width:100%;height:100%;border:0;background:#fff}@media(max-width:760px){header{height:auto;padding:12px;flex-wrap:wrap}.controls{width:100%;margin:0}.controls select,.controls button{flex:1}main{display:block;height:calc(100vh - 128px)}aside{display:none}}
  </style>
</head>
<body>
<header><h1>超级球球官网｜翻译进度预览</h1><span class="badge">内部预览 · 不会上线</span><div class="controls"><select id="page"><option value="index.html">首页</option><option value="product.html">产品页</option><option value="ai-system.html">YouAI 系统</option><option value="partner.html">商业合作</option><option value="contact.html">联系我们</option><option value="news.html">品牌资讯</option></select><select id="lang"><option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option><option value="da">Dansk</option></select><button id="open">刷新预览</button></div></header>
<main><aside><h2>当前翻译进度</h2><div class="item"><div class="row"><span>首页</span><b>100%</b></div><div class="bar"><i style="width:100%"></i></div></div><div class="item"><div class="row"><span>产品页</span><b>翻译中</b></div><div class="bar"><i style="width:18%"></i></div></div><div class="item"><div class="row"><span>其余主页面</span><b>待完成</b></div><div class="bar"><i style="width:8%"></i></div></div><div class="item"><div class="row"><span>53 篇资讯</span><b>待完成</b></div><div class="bar"><i style="width:0%"></i></div></div><div class="note">切换语言后，预览页会使用官网真实的语言系统。尚未翻译的部分仍会显示中文，这正是当前施工进度。</div></aside><iframe id="frame" title="官网翻译预览"></iframe></main>
<script>
  const page=document.querySelector('#page'),lang=document.querySelector('#lang'),frame=document.querySelector('#frame');
  function load(){localStorage.setItem('superbobo-language',lang.value);frame.src=page.value+'?preview='+Date.now()}
  document.querySelector('#open').addEventListener('click',load);page.addEventListener('change',load);lang.addEventListener('change',load);load();
</script>
</body>
</html>
